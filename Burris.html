<P><TABLE class="MsoNormalTable" BORDER="0" CELLPADDING="0" WIDTH="866"

 mso-cellspacing:1.5pt;mso-padding-alt:0in .05in 0in 5.05pt"

  <TR style="mso-yfti-irow:0">

    <TD WIDTH="83%" style="width:83.0%;padding:0in .05in 0in 5.05pt">
      <P><span style='font-size:18.0pt'>Timeline of Joshua <span class=SpellE>Burriss</span>
      and Family<BR>
      </span><I>Includes data for <span class=SpellE>Burriss</span>'
      who may be related or may be unrelated<o:p></o:p></I></P>

      <P><!--[if gte vml 1]><v:shapetype id="_x0000_t75" coordsize="21600,21600"
   o:spt="75" o:preferrelative="t" path="m@4@5l@4@11@9@11@9@5xe" filled="f"

      WIDTH="281" HEIGHT="285" ALIGN="RIGHT" BORDER="0" NATURALSIZEFLAG="3"><!--[endif]><I>Primary
      Sources:<BR>
      Bertie NC <span class=SpellE>Deedbooks</span><BR>
      Bertie NC Court of Common Pleas and Quarter Sessions 1724-1743,
      1758 -1792<o:p></o:p></I></P>

      <P><st1:Street><st1:address><B><span style='color:#993300'>1741</span></B><span
    style='mso-bidi-font-weight:bold'> Apr Chowan Court</span></st1:address></st1:Street><span
  style='mso-bidi-font-weight:bold'>  Deed of sale John Singleton
      to Walter Phelps proven by oath of <B>James <span class=SpellE>Burras</span></B>,
      wit. <o:p></o:p></span></P>

      <P><B><span style='color:#990000'>1747</span></B> - Bertie NC
      - Deeds - Lewis Sowell yeoman of Johnston Co to <B>James <span class=SpellE>Burras</span></B>
      Mar 23 1746/7 200 ac near the River <span class=SpellE>Pocoson</span>
      at <st1:place><st1:PlaceName>Horse</st1:PlaceName> <st1:PlaceType>Swamp</st1:PlaceType></st1:place>
      <span class=SpellE>adj</span> <span class=SpellE>Obediah</span>
      Sowell. Wit: Wm Hooker <span class=SpellE>Jr</span>, James Blunt.
      (entered Feb Court 1747)</P>

      <P>____________________________________________</P>

      <P><B><span style='color:#990000'>1750</span></B> - Bertie NC
      - Deeds - John <span
  class=SpellE>Wynns</span> yeoman to <B>James <span class=SpellE>Burrass</span></B>
      <st1:date Month="5" Day="5" Year="1750">May 5 1750</st1:date>
      (also listed <st1:date
  Month="1" Day="1" Year="1744">Jan 1 1744</st1:date>) 200 ac
      on SS of <span
  class=SpellE>Flatt</span> Swamp of <span class=SpellE>Killum</span>
      and ES of Old Road at <st1:place><st1:PlaceName>Old</st1:PlaceName>
      <st1:PlaceType>Bridge</st1:PlaceType></st1:place>. <span class=SpellE>adj</span>
      White wit: Thomas Hansford, Wm Hansford (entered Aug Court 1750)</P>

      <P><B><span style='color:#990000'>1755</span></B> - Bertie NC
      - Deeds - Benjamin Hooker yeoman to Wm Hooker planter <st1:date Month="5" Day="19"
  Year="1755">May 19 1755</st1:date> <span class=SpellE>adj</span>
      Wm Hooker, <span
  class=SpellE>Benet</span>, Thomas Rogers. Wit: <B>Joshua Burros</B>,
      Ann Harrell. (entered July Court 1755)</P>

      <P><B><span style='color:#993300'>1756</span></B> Aug 9 Bertie
      Coroner Inquest  Held at Society Parish Bertie. Joseph Hardy
      coroner. James See killed by a bullet or large <span class=SpellE>shott</span>
      between his right and left breast that did enter 7 or 9 inches
      and one blow on the back part of the head by an unknown person.
      Jury: Matt Hardy, James <span
  class=SpellE>Wynns</span>, Wm Hooker, Andrew <span class=SpellE>Galiver</span>,
      <span class=SpellE>Aron</span> Oliver, Ephraim Hunter, John Hunter,
      Wm <span
  class=SpellE>Laciter</span>, Wm Brown, Jacob Keel, Moses Oliver,
      John Downing, Alexander Valentine, Michael Reynolds, Edward Bird,
      Robert Sumner, <B>James <span class=SpellE>Burriss</span></B>.</P>

      <P><B><span style='color:#990000'>1757</span></B> - Bertie NC
      - <A HREF="http://ftp.rootsweb.com/pub/usgenweb/nc/bertie/census/tax1757.txt">Tax
      List </A>(Wm Wynn)<BR>
      <B>Joshua <span class=SpellE>Burrass</span></B> - 1</P>

      <P><B><span style='color:#990000'>1757</span></B> - Bertie NC
      - &quot;Colonial Estates&quot;<BR>
      March 22: Wm Downing <span class=SpellE>vs</span> John Freeman
      - John Freeman, John Smith and <B>Joshua <span class=SpellE>Burress</span></B>
      all of Bertie Co give bond that Freeman will appear (re: Supreme
      Ct at Edenton: trespass and a slave)</P>

      <P><B><span style='color:#993300'>1758 </span></B>Oct 7  Bertie
      NC DB I  Luke White <span class=SpellE>Sr</span> yeoman of Chowan
      to son Jacob Hill <span class=SpellE>aka</span> Jacob White gift
      200 acres where Hill now lives joining Jacob Hill, <B>James <span class=SpellE>Burross</span>
      Sr</B>. Wit: John Berry Henry Haste. Proven Apr Court 1759.</P>

      <P><B><span style='color:#990000'>1759</span></B> -<B> <I>Hertford
      Co formed from Bertie, Chowan and </I></B><st1:City><st1:place><B><I>Northampton</I></B></st1:place></st1:City><B><o:p></o:p></B></P>

      <P><B><span style='color:#993300'>1759</span></B><span style='mso-bidi-font-weight:
  bold'> Jan 23  Bertie NC DB I - Burrell Bell of Bertie to John
      <span
  class=SpellE>Kaile</span> of same 100 ac on westward side of
      Blounts <span
  class=SpellE>Pocoson</span>, joining Luke White Sr. <B>James
      Burros</B>, Burwell Bell, <span class=SpellE>Maguires</span>
      former line. Wit: Geo Barlow, Per. Evans. Proven April Court
      1759.<o:p></o:p></span></P>

      <P><B><span style='color:#993300'>1759</span></B><span style='mso-bidi-font-weight:
  bold'> Aug 13  Bertie NC DB K  Burrell Bell gent of Bertie to
      Henry Haste yeoman of same 125 ac joining <span class=SpellE>Flatt</span>
      Swamp, main road, <B>James <span class=SpellE>Burrass</span></B>,
      Blounts Branch, Thos Yeats. Wit: Humphrey Nicholls, Joshua Sutton.
      Proven April Court 1761.<o:p></o:p></span></P>

      <P><B><span style='color:#993300'>1759</span></B><span style='mso-bidi-font-weight:
  bold'> Sept 7  Bertie NC DB I  Burrell Bell of Bertie to <B>Joshua
      <span class=SpellE>Burross</span> yeoman</B> of same 171 ac south
      side of </span><st1:place><st1:PlaceName><span
    class=SpellE><span style='mso-bidi-font-weight:bold'>Flatt</span></span></st1:PlaceName><span
   style='mso-bidi-font-weight:bold'> </span><st1:PlaceType><span
    style='mso-bidi-font-weight:bold'>Swamp</span></st1:PlaceType></st1:place><span
  style='mso-bidi-font-weight:bold'> joining Absalom Harrell.
      Wit: James Harrell, Mary <span class=SpellE>Wynns</span>. Proven
      Oct court 1759.<o:p></o:p></span></P>

      <P><B><span style='color:#993300'>1759</span></B><span style='mso-bidi-font-weight:
  bold'> Sept 8  Bertie NC DB I  Burrell Bell gent of Bertie to
      Joseph <span class=SpellE>Harriss</span> of same 228 ac on Mare
      Branch joining James Fletcher, Wm Williamson, <span class=SpellE>Flatt</span>
      Swamp, <B>James <span class=SpellE>Burress</span> </B>Wit: Per.
      Evans, James Hare James Williams. <o:p></o:p></span></P>

      <P>____________________________________________</P>

      <P><B><span style='color:#990000'>1760 </span></B>- Bertie NC
      - Hannah Hooker suicide; drowned herself in well. Inquest held
      at house of Benjamin Hooker. Jury: John Freeman, Wm Tyner, James
      Freeman, <B>Joshua <span class=SpellE>Burrouss</span></B>, Richard
      Sowell, John <span class=SpellE>Daveson</span>, Jacob Keel, Richard
      Raines, Wm Pierce, <span class=SpellE>Absolem</span> <span class=SpellE>harrell</span>,
      James <span class=SpellE>Haire</span>, Sol. Baker, Henry Haste.</P>

      <P><st1:Street><st1:address><B><span
    style='color:#993300'>1760</span></B> Jan Bertie Court</st1:address></st1:Street>
       <B>Joshua <span class=SpellE>Burress</span></B> appointed overseer
      in the room of William Tyner</P>

      <P><B><span style='color:#993300'>1760</span></B> July 13  Bertie
      NC DB K - James Bell of Sussex VA and John Harrell of Hertford
      executor of <span class=SpellE>Willo</span> of Burrell Bell <span
  class=SpellE>decd</span> to <B>Joshua <span class=SpellE>Burras</span></B>,
      cooper, of Bertie Co <span
  class=SpellE>sd</span> Bell in Will dated 13 Jul 1760 appointed
      to execute deeds. 100 ac on S side of <st1:place><st1:PlaceName><span class=SpellE>Flatt</span></st1:PlaceName>
      <st1:PlaceType>Swamp</st1:PlaceType></st1:place> <span class=SpellE>adj</span>
      John Berry, Joshua <span class=SpellE>Burras</span>, wit: David
      Valentine, <span
  class=SpellE>Absolem</span> Harrell. Proven May Court 1764</P>

      <P><B><span style='color:#990000'>1761</span></B> - Hertford
      NC - Granville Grant 4385 - Robert Sumner 17 Dec 1761 to John
      Baker to survey 700 ac Hertford Co on Southwest side of Chowan
      River joining <B>James <span
  class=SpellE>Burress</span></B>, Aaron Sowell, Wm Stephens,
      Wm Freeman, and Sumner's own line. <span class=GramE>executed</span>
      <st1:date Year="1761"
  Day="23" Month="4">23 Apr 1761</st1:date>.</P>

      <P><B><span style='color:maroon'>1764</span></B> <st1:place><st1:City>Bertie</st1:City>
      <st1:State>NC</st1:State></st1:place>  Tax List <BR>
      <B>James <span class=SpellE>Birnus</span></B> 1 wm, 1 negro wench</P>

      <P><B><span style='color:#993300'>1765</span></B> Feb 5  Bertie
      NC DB K  Simon Parker planter of <span
  class=SpellE>Edgecomb</span> to Wm Robinson of Bertie 200 ac
      joining <span
  class=SpellE>Pettforms</span> meadow, <span class=SpellE>Chinkapen</span>
      Swamp, Capt John Campbell. Wit: James Sutton, <B>Joshua <span class=SpellE>Burress</span></B>.
      Proven March court 1765.</P>

      <P><st1:Street><st1:address><B><span
    style='color:#993300'>1767 </span></B>June Bertie Court</st1:address></st1:Street>
       Ordered that <B>James Burris <span
  class=SpellE>Jr</span></B> appointed overseer of new road from
      <span
  class=SpellE>Wicocon</span> Ferry rd to the line and that the
      following hands work same: Steven White Joshua <span class=SpellE>Ivans</span>,
      John <span
  class=SpellE>Kail</span>, <span class=SpellE>Dempcy</span> Cole
      and Thomas Hubbard.</P>

      <P><st1:Street><st1:address><B><span
    style='color:#993300'>1767</span></B> Sept Bertie Court</st1:address></st1:Street>
       Ordered that James Campbell appointed overseer of new <span
  class=SpellE>raod</span> from <span class=SpellE>Fagg</span>
      <span
  class=SpellE>Pocoso</span> on <span class=SpellE>Stoney</span>
      Cr rd to <span
  class=SpellE>Mrs</span> <span class=SpellE>Cockrells</span>
      plantation to where Benjamin Stone works. List of hands : <B>Samuel
      <span class=SpellE>Burriss</span> </B>[others]</P>

      <P><B><span style='color:#990000'>1768</span></B> - Bertie NC
      - Tax List (James Campbell)<BR>
      <span class=SpellE><B>Burrass</B></span><B>, James</B> and negroes
      Pomp and Rose - 1 wm, 1 nm, 1 <span class=SpellE>nf</span><BR>
      <span class=SpellE><B>Burrass</B></span><B>, Joshua <span class=SpellE>Sr</span></B>
      and son <span class=SpellE><B>Absolom</B></span> and negro Lazarus-
      2 wm, 1 nm, 1 <span class=SpellE>nf</span></P>

      <P><B><span style='color:blue'>1768</span></B><span style='color:blue'>
      - Hertford NC - Will of <B>James <span class=SpellE>Burruss</span></B>.
